<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Interativo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>📊 Meu Dashboard</h1>
    <button id="btn-tema" class="btn-tema">🌙</button>
  </header>

  <main class="container">
    <!-- FORMULÁRIO -->
    <section class="card">
      <h2>➕ Nova Tarefa</h2>
      <form id="form-tarefa">
        <input 
          type="text" 
          id="input-tarefa" 
          placeholder="Digite o nome da tarefa..." 
          autocomplete="off"
          required
        >
        <select id="select-prioridade">
          <option value="baixa">🟢 Baixa</option>
          <option value="media" selected>🟡 Média</option>
          <option value="alta">🔴 Alta</option>
        </select>
        <button type="submit">Adicionar</button>
      </form>
      <p id="msg-erro" class="erro"></p>
    </section>

    <!-- BUSCA E FILTROS -->
    <section class="card">
      <h2>🔍 Buscar</h2>
      <input 
        type="text" 
        id="input-busca" 
        placeholder="Filtrar tarefas..."
        autocomplete="off"
      >
      <div class="stats">
        <span>Total: <strong id="stat-total">0</strong></span>
        <span>Concluídas: <strong id="stat-concluidas">0</strong></span>
        <span>Pendentes: <strong id="stat-pendentes">0</strong></span>
      </div>
    </section>

    <!-- LISTA DE TAREFAS -->
    <section class="card">
      <h2>📝 Tarefas</h2>
      <ul id="lista-tarefas" class="lista"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
